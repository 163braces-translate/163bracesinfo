{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1>{{ tr(page, 'title') }}</h1>
  {% set body = tr(page, 'body_html') %}
  {% if body %}<div class="intro">{{ body | safe }}</div>{% endif %}
</div>
{% if articles %}
  <div class="article-grid">{% for a in articles %}{% include "_article_card.html" %}{% endfor %}</div>
{% else %}
  <p class="empty">—</p>
{% endif %}
{% endblock %}
