{% extends "admin/base.html" %}
{% block title %}登入{% endblock %}
{% block bare %}
<div class="login-wrap">
  <form class="card login" method="post" action="/admin/login">
    {%- set logo_id = site_logo_id() %}
    <a class="brand" href="/">{% if logo_id %}<img class="brand-mark" src="/site-icon/64.png?v={{ logo_id }}" alt="">{% else %}<span class="brand-mark">163</span>{% endif %}<span>163braces 後台</span></a>
    {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field" for="username">帳號</label>
    <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
    <label class="field" for="password" style="margin-top: 12px">密碼</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit" style="width: 100%; margin-top: 18px">登入</button>
  </form>
</div>
{% endblock %}
